services:
  - type: web
    name: efex-operator-demo-api-eduardo
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bun install --frozen-lockfile
    startCommand: bun run --cwd apps/api start
    healthCheckPath: /health
    envVars:
      - key: BUN_VERSION
        value: 1.3.13
      - key: DATABASE_PATH
        value: /tmp/efex-demo.sqlite
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_BASE_URL
        value: https://supervisor-east-us-2-resource.openai.azure.com/openai/v1
      - key: AZURE_OPENAI_MODEL
        value: gpt-5.6-luna
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: KAPSO_WEBHOOK_SECRET
        sync: false
      - key: WEB_ORIGIN
        value: https://efex-operator-demo-loama.onrender.com
      - key: PUBLIC_API_ORIGIN
        value: https://efex-operator-demo-api-eduardo.onrender.com
      - key: PUBLIC_APP_ORIGIN
        value: https://efex-operator-demo-loama.onrender.com
      - key: DEMO_REQUEST_LIMIT
        value: 120

  - type: web
    name: efex-operator-demo-loama
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: bun install --frozen-lockfile && bun run --cwd apps/mobile expo export --platform web --clear
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: BUN_VERSION
        value: 1.3.13
      - key: EXPO_PUBLIC_API_URL
        value: https://efex-operator-demo-api-eduardo.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
